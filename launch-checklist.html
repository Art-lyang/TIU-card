<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>TERMINAL SESSION — Launch Checklist</title>
<style>
:root{color-scheme:light;--bg:#fff;--bg2:#f7f7f5;--bg3:#f0efeb;--tx:#1a1a1a;--tx2:#666;--tx3:#999;--bd:#e5e5e0;--blue:#2563eb;--green:#16a34a;--amber:#d97706;--red:#dc2626;--purple:#7c3aed;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--tx);padding:20px 24px;max-width:720px}
h1{font-size:18px;font-weight:600;margin-bottom:4px}
.sub{font-size:13px;color:var(--tx2);margin-bottom:20px}
.progress-wrap{background:var(--bg3);border-radius:8px;height:10px;margin-bottom:20px;overflow:hidden}
.progress-bar{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--blue),var(--purple));transition:width 0.4s}
.progress-label{font-size:12px;color:var(--tx2);text-align:right;margin-bottom:16px}
.phase{margin-bottom:24px}
.phase-header{display:flex;align-items:center;gap:8px;cursor:pointer;padding:8px 0;border-bottom:1px solid var(--bd);user-select:none}
.phase-header:hover{opacity:0.8}
.phase-icon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;flex-shrink:0}
.phase-title{font-size:14px;font-weight:600;flex:1}
.phase-count{font-size:12px;color:var(--tx3);background:var(--bg2);padding:2px 8px;border-radius:10px}
.phase-arrow{font-size:12px;color:var(--tx3);transition:transform 0.2s}
.phase-arrow.open{transform:rotate(90deg)}
.items{padding:4px 0 0 36px;display:none}
.items.open{display:block}
.item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--bg3)}
.item:last-child{border-bottom:none}
.check{width:18px;height:18px;border-radius:4px;border:1.5px solid var(--bd);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all 0.15s;margin-top:1px}
.check.done{background:var(--green);border-color:var(--green)}
.check.partial{background:var(--amber);border-color:var(--amber)}
.item-body{flex:1;min-width:0}
.item-title{font-size:13px;font-weight:500;line-height:1.4}
.item-title.done{text-decoration:line-through;opacity:0.5}
.item-desc{font-size:12px;color:var(--tx2);margin-top:2px;line-height:1.5}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;font-weight:500}
.tag-done{background:#dcfce7;color:#15803d}
.tag-partial{background:#fef3c7;color:#92400e}
.tag-todo{background:#fee2e2;color:#991b1b}
.tag-p0{background:#fce7f3;color:#9d174d}
.tag-p1{background:#e0e7ff;color:#3730a3}
.tag-p2{background:#f0fdf4;color:#166534}
.summary{background:var(--bg2);border-radius:12px;padding:16px 20px;margin-bottom:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;text-align:center}
.s-num{font-size:22px;font-weight:600}
.s-label{font-size:11px;color:var(--tx2);margin-top:2px}
</style>
</head>
<body>

<h1>TERMINAL SESSION — 출시 체크리스트</h1>
<p class="sub">모바일 우선 (앱스토어/플레이스토어) → PC (Steam) 순서</p>

<div class="summary" id="summary"></div>
<div class="progress-wrap"><div class="progress-bar" id="pbar"></div></div>
<div class="progress-label" id="plabel"></div>

<div id="app"></div>

<script>
var DATA=[
{phase:"P0 — 필수 기술 (출시 차단)",color:"#dc2626",items:[
{t:"PWA manifest.json + Service Worker",d:"오프라인 플레이 지원. 앱스토어 래핑(Capacitor/TWA) 전 필수.",s:0,p:"p0"},
{t:"Capacitor 또는 TWA 래핑",d:"웹앱을 네이티브 앱으로 패키징. iOS=Capacitor, Android=TWA 또는 Capacitor.",s:0,p:"p0"},
{t:"package.json + 빌드 파이프라인",d:"npm init → Vite/빌드 도구 세팅. 에셋 캐시버스팅, 번들 최적화.",s:0,p:"p0"},
{t:"에러 핸들링 강화",d:"window.onerror, unhandledrejection 글로벌 캐치. 크래시 시 세이브 보호.",s:0,p:"p0"},
{t:"PC 키보드 조작",d:"좌우 방향키 + 숫자키 1,2로 선택지 조작. 현재 components-game.js에 부분 구현.",s:1,p:"p0"},
{t:"개인정보 처리방침 / 이용약관",d:"앱스토어 필수 제출 문서. localStorage 사용 관련 명시.",s:0,p:"p0"},
]},
{phase:"P1 — 콘텐츠 완성도",color:"#d97706",items:[
{t:"EN 번역 품질 검수",d:"4,750라인 번역 존재하나 네이티브 검수 미완. 서사 톤/뉘앙스 확인.",s:1,p:"p1"},
{t:"튜토리얼 / 온보딩",d:"첫 플레이 가이드. 스와이프 조작·자원 의미·증거 시스템 안내.",s:0,p:"p1"},
{t:"밸런스 최종 튜닝",d:"rebel 루트 즉사율 14%, newbie 31% — 시뮬레이터 기준 재조정 필요.",s:1,p:"p1"},
{t:"엔딩 크레딧/스태프 롤",d:"엔딩 도달 후 제작진 크레딧 화면.",s:0,p:"p1"},
{t:"접근성 (폰트 크기/색각)",d:"설정에서 폰트 크기 조절 존재. 색맹 모드 검토.",s:1,p:"p1"},
]},
{phase:"P2 — 아트/사운드 보강",color:"#7c3aed",items:[
{t:"캐릭터 일러스트 리파인",d:"현재 25장. 상업 수준 일관성 확인, 해상도 통일.",s:1,p:"p2"},
{t:"카드 배경 아트 추가",d:"현재 16장 BG. Act별 분위기 차이 강화.",s:1,p:"p2"},
{t:"앱 아이콘 + 스토어 스크린샷",d:"1024×1024 아이콘, 앱스토어/플레이스토어 규격 스크린샷 5~8장.",s:0,p:"p2"},
{t:"BGM 추가 (최소 6~8트랙)",d:"현재 4 Act BGM. 이브닝·미션·엔딩별 트랙 필요.",s:0,p:"p2"},
{t:"SFX 보강",d:"현재 8개 효과음. UI 피드백, 증거 조합, 게임오버 등 추가.",s:1,p:"p2"},
{t:"엔딩 일러스트 리파인",d:"현재 15장. 16종 엔딩 전체 커버 + 품질 통일.",s:1,p:"p2"},
]},
{phase:"P3 — 스토어 등록 / 비즈니스",color:"#2563eb",items:[
{t:"수익 모델 확정",d:"유료 ($3~5) / F2P+광고 / 프리미엄 중 결정. DLC 확장팩 구조 설계.",s:0,p:"p0"},
{t:"Apple Developer 계정",d:"연 $99. 앱 심사 가이드라인 숙지.",s:0,p:"p1"},
{t:"Google Play 개발자 계정",d:"$25 일회성. 콘텐츠 등급 설문(IARC) 준비.",s:0,p:"p1"},
{t:"앱 콘텐츠 등급 (IARC)",d:"폭력/공포 표현 자가 등급 심사. 현재 콘텐츠 기준 12+ 예상.",s:0,p:"p1"},
{t:"스토어 설명 / ASO",d:"앱 제목·부제·설명·키워드 최적화. KO/EN 양언어.",s:0,p:"p2"},
{t:"마케팅 랜딩 페이지",d:"GitHub Pages 현재 배포 → 공식 사이트 + 트레일러.",s:0,p:"p2"},
{t:"베타 테스트 (TestFlight / 내부 테스트)",d:"출시 전 외부 테스터 피드백 수집.",s:0,p:"p1"},
]},
{phase:"P4 — PC 출시 (2차)",color:"#16a34a",items:[
{t:"Steam 개발자 등록",d:"Steamworks 파트너 등록 + $100 앱 크레딧.",s:0,p:"p2"},
{t:"Electron/Tauri 래핑",d:"데스크톱 앱 패키징. 풀스크린, 창 크기 조절.",s:0,p:"p2"},
{t:"Steam 업적 연동",d:"16종 엔딩 + 증거 조합 등 업적 매핑.",s:0,p:"p2"},
{t:"Steam 스토어 페이지",d:"트레일러, 스크린샷, 설명, 태그 설정.",s:0,p:"p2"},
{t:"키보드/마우스 풀 지원",d:"PC에서 마우스 드래그 + 키보드 단축키 완전 지원.",s:1,p:"p1"},
]}
];

function render(){
  var app=document.getElementById('app');
  app.innerHTML='';
  var total=0,done=0,partial=0;
  DATA.forEach(function(ph){
    ph.items.forEach(function(it){total++;if(it.s===2)done++;else if(it.s===1)partial++})
  });
  var pct=Math.round((done+partial*0.5)/total*100);
  document.getElementById('pbar').style.width=pct+'%';
  document.getElementById('plabel').textContent=pct+'% 완료 ('+done+'/'+total+' 완료, '+partial+' 진행중)';
  document.getElementById('summary').innerHTML=
    '<div><div class="s-num" style="color:var(--green)">'+done+'</div><div class="s-label">완료</div></div>'+
    '<div><div class="s-num" style="color:var(--amber)">'+partial+'</div><div class="s-label">진행중</div></div>'+
    '<div><div class="s-num" style="color:var(--red)">'+(total-done-partial)+'</div><div class="s-label">미착수</div></div>'+
    '<div><div class="s-num" style="color:var(--blue)">'+total+'</div><div class="s-label">전체</div></div>';

  DATA.forEach(function(ph,pi){
    var pdone=ph.items.filter(function(x){return x.s===2}).length;
    var div=document.createElement('div');div.className='phase';
    var hdr=document.createElement('div');hdr.className='phase-header';
    hdr.innerHTML='<div class="phase-icon" style="background:'+ph.color+'">P'+pi+'</div>'+
      '<span class="phase-title">'+ph.phase+'</span>'+
      '<span class="phase-count">'+pdone+'/'+ph.items.length+'</span>'+
      '<span class="phase-arrow" id="arrow-'+pi+'">▶</span>';
    var items=document.createElement('div');items.className='items';items.id='items-'+pi;
    hdr.onclick=function(){
      var open=items.classList.toggle('open');
      document.getElementById('arrow-'+pi).classList.toggle('open',open)
    };
    ph.items.forEach(function(it,ii){
      var row=document.createElement('div');row.className='item';
      var stag=it.s===2?'<span class="tag tag-done">완료</span>':it.s===1?'<span class="tag tag-partial">진행중</span>':'<span class="tag tag-todo">미착수</span>';
      var ptag='<span class="tag tag-'+it.p+'">'+it.p.toUpperCase()+'</span>';
      row.innerHTML='<div class="check'+(it.s===2?' done':it.s===1?' partial':'')+'" data-p="'+pi+'" data-i="'+ii+'">'+(it.s===2?'✓':it.s===1?'—':'')+'</div>'+
        '<div class="item-body"><div class="item-title'+(it.s===2?' done':'')+'">'+it.t+stag+ptag+'</div><div class="item-desc">'+it.d+'</div></div>';
      row.querySelector('.check').onclick=function(e){
        e.stopPropagation();
        it.s=(it.s+1)%3;
        render()
      };
      items.appendChild(row)
    });
    div.appendChild(hdr);div.appendChild(items);app.appendChild(div)
  });
  // auto-open first incomplete phase
  for(var i=0;i<DATA.length;i++){
    if(DATA[i].items.some(function(x){return x.s<2})){
      document.getElementById('items-'+i).classList.add('open');
      document.getElementById('arrow-'+i).classList.add('open');
      break
    }
  }
}
render();
</script>
</body>
</html>
